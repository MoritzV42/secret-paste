name: lint

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'MARKETING.md'
      - 'ROADMAP.md'
      - 'SETUP.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'MARKETING.md'
      - 'ROADMAP.md'
      - 'SETUP.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff + black
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5" "black>=24"

      - name: Run ruff
        run: ruff check .

      - name: Run black --check
        run: black --check .
